name: Deploy Django API

on:
  push:
    branches: ["main", "master"]
    paths:
      - "**/*.py"
      - "requirements.txt"
      - "Dockerfile"
      - "scripts/**"
      - "deploy/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-django
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, linux, satoori]
    env:
      DEPLOY_ROOT: /opt/protfolio/satoori
      DOCKER_SUDO: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Docker
        run: |
          docker --version
          docker compose version

      - name: Prepare runtime env
        shell: bash
        run: |
          if [ -z "${{ secrets.DJANGO_SECRET_KEY }}" ]; then
            echo "DJANGO_SECRET_KEY secret is required."
            exit 1
          fi
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ] && [ -z "${{ secrets.OPENAI_API_KEY }}" ]; then
            echo "Either GEMINI_API_KEY or OPENAI_API_KEY secret is required."
            exit 1
          fi

          mkdir -p "$DEPLOY_ROOT/env"
          cat > "$DEPLOY_ROOT/env/api.env" <<EOF
          DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_DEBUG=False
          DJANGO_ALLOWED_HOSTS=satoori-api.protfolio.store
          CORS_ALLOW_ALL_ORIGINS=False
          CORS_ALLOWED_ORIGINS=https://satoori.protfolio.store
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL=gemini-2.5-flash-lite
          GEMINI_SPEECH_MODEL=gemini-2.5-flash-lite
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL=gpt-4o-mini
          OPENAI_FALLBACK_ENABLED=False
          EOF

      - name: Deploy Django
        run: bash scripts/deploy_django.sh

      - name: Smoke check
        env:
          WEB_URL: https://satoori.protfolio.store
          API_URL: https://satoori-api.protfolio.store/api
        run: bash scripts/smoke_check.sh
