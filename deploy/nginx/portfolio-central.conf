server {
  listen 80;
  server_name protfolio.store;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name protfolio.store;

  ssl_certificate /etc/letsencrypt/live/protfolio.store/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/protfolio.store/privkey.pem;

  root /usr/share/nginx/main;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|woff|woff2)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}

server {
  listen 80;
  server_name satoori.protfolio.store satoori-api.protfolio.store;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name satoori.protfolio.store;

  ssl_certificate /etc/letsencrypt/live/satoori.protfolio.store/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/satoori.protfolio.store/privkey.pem;

  root /usr/share/nginx/html;
  index index.html;

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  location = /flutter_service_worker.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  location = /manifest.json {
    add_header Cache-Control "no-cache" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|woff|woff2)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name satoori-api.protfolio.store;

  ssl_certificate /etc/letsencrypt/live/satoori.protfolio.store/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/satoori.protfolio.store/privkey.pem;

  location = / {
    return 302 /api/docs/;
  }

  location / {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}

