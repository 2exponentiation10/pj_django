server {
  listen 80;
  server_name koinori.protfolio.store;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name koinori.protfolio.store;

  ssl_certificate /etc/letsencrypt/live/koinori.protfolio.store/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/koinori.protfolio.store/privkey.pem;

  location / {
    proxy_pass http://172.17.0.1:7085;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
